<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f7f8f6"><title>今日 · 计划清单</title><meta name="description" content="今日规划与长期项目清单"></head><body><main class="workspace"><header class="topbar"><div class="brand"><span>今</span>今日</div><div class="top-tools"><span id="sync" class="sync-status" role="status">正在读取…</span><button id="settings" class="quiet">设置</button></div></header><div class="greeting">ONE STEP AT A TIME</div><h1>把想做的，慢慢做成。</h1><p class="subtitle">从今天的一小步，走向更长远的计划。</p><div id="notice" class="notice" hidden></div><section><div class="section-head"><h2 id="daily-heading">☀ 今日规划</h2><div class="date-nav"><button id="prev" aria-label="前一天">‹</button><span id="date-label"></span><button id="next" aria-label="后一天">›</button><button id="today">今天</button></div></div><div class="daily-panel"><div class="panel-summary"><span id="daily-count">0 项计划</span><div class="progress"><i id="progress"></i></div></div><div id="daily-list"></div><form id="daily-form" class="add-item"><input id="daily-input" required maxlength="500" placeholder="今天想完成什么？" aria-label="今日计划"><button aria-label="添加今日计划">＋</button></form></div></section><section class="projects"><div class="section-head"><h2>📂 各种规划</h2><div class="boards-nav"><button id="boards-left" class="arrow" aria-label="上一张规划">‹</button><button id="boards-right" class="arrow" aria-label="下一张规划">›</button><button id="new-board" class="outline">＋ 新建规划</button></div></div><p class="subtitle">月规划、论文、一个长期目标，都可以放在这里。左右滑动查看 →</p><div id="boards" class="board-track"></div></section><footer class="page-foot">不必一次完成所有事。<span>YOUR PLANS, YOUR PACE</span></footer></main>
<dialog id="edit-dialog"><form id="edit-form"><div class="dialog-head"><h2 id="edit-heading">编辑计划</h2><button type="button" class="close" data-close="edit-dialog" aria-label="关闭">×</button></div><label>内容<textarea id="edit-title" required maxlength="500"></textarea></label><label id="color-label" hidden>卡片颜色<select id="edit-color"><option value="mint">薄荷绿</option><option value="blue">浅蓝</option><option value="lavender">淡紫</option><option value="sand">米黄</option></select></label><p id="edit-error" class="error" role="alert"></p><div class="dialog-actions"><button id="delete-board" type="button" class="danger" hidden>删除整个规划</button><button type="button" class="outline" data-close="edit-dialog">取消</button><button id="edit-save" class="primary">保存</button></div></form></dialog>
<dialog id="settings-dialog"><div class="dialog-head"><h2>同步与设置</h2><button class="close" data-close="settings-dialog" aria-label="关闭">×</button></div><p class="help">公开共享清单：任何访问者都能查看、添加、修改和删除内容。设备间约每 15 秒同步一次。</p><form id="config-form"><label>云端项目地址<input id="cloud-url" type="url" required></label><label>公开连接密钥<input id="cloud-key" required></label><button class="primary">保存配置</button></form><p class="help">使用 Publishable key 或 anon 公钥，不要填写管理员密钥。</p><div class="settings-actions"><button id="export" class="outline">导出全部清单</button><button id="refresh" class="outline">立即同步</button></div></dialog><div id="toast" role="status" hidden></div><script type="module" src="/src/checklists.js"></script></body></html>
